<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Change password — Concap AI</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/auth.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
  <style>
    .concap-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Fraunces', 'Times New Roman', serif;
      font-size: 22px; font-weight: 400;
      letter-spacing: -0.02em; font-style: italic;
      color: #fff;
    }
    .concap-logo-mark {
      width: 26px; height: 26px; position: relative;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .concap-logo-mark::before {
      content: ''; position: absolute; inset: 0;
      border: 1.5px solid #FF5B2E; border-radius: 50%;
    }
    .concap-logo-mark::after {
      content: ''; width: 8px; height: 8px;
      background: #FF5B2E; border-radius: 50%;
      animation: concapPulse 2.2s ease-in-out infinite;
    }
    @keyframes concapPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand" style="margin-bottom:24px;">
        <div class="concap-logo">
          <div class="concap-logo-mark"></div>
          Concap AI
        </div>
      </div>

      <h1>Set a new password</h1>
      <p class="sub" id="sub">Choose a password to replace your temporary one.</p>

      <div id="alert"></div>

      <form id="cp-form">
        <div class="field">
          <label for="current">Current / temporary password</label>
          <input id="current" type="password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="newpw">New password</label>
          <input id="newpw" type="password" autocomplete="new-password" required minlength="8" />
          <div class="subtle" style="margin-top:6px;">At least 8 characters.</div>
        </div>
        <button type="submit" id="submit-btn">Update password</button>
      </form>

      <div class="switch"><a href="#" id="signout">Sign out instead</a></div>
    </div>
  </div>

  <script>
    (function () {
      if (!window.Auth || !window.Auth.isAuthed()) {
        window.location.replace("/login");
        return;
      }
      var form = document.getElementById("cp-form");
      var alertEl = document.getElementById("alert");
      var btn = document.getElementById("submit-btn");
      document.getElementById("signout").addEventListener("click", function (e) {
        e.preventDefault();
        window.Auth.logout();
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        btn.disabled = true;
        alertEl.innerHTML = "";
        var np = document.getElementById("newpw").value;
        if (np.length < 8) {
          alertEl.innerHTML = '<div class="alert error">New password must be at least 8 characters.</div>';
          btn.disabled = false;
          return;
        }
        try {
          var resp = await fetch("/api/auth/change-password", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              current_password: document.getElementById("current").value,
              new_password: np,
            }),
          });
          var data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || ("Failed (" + resp.status + ")"));
          // Refresh stored user so the must_change_password guard clears.
          var tok = window.Auth.getToken();
          window.Auth.set(tok, data);
          window.location.href = "/booth";
        } catch (err) {
          alertEl.innerHTML = '<div class="alert error">' + err.message + "</div>";
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
