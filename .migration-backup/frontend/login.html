<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Sign in — Concap AI</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
  <style>
    .concap-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Fraunces', 'Times New Roman', serif;
      font-size: 22px; font-weight: 400;
      letter-spacing: -0.02em; font-style: italic;
      color: #fff;
    }
    .concap-logo-mark {
      width: 26px; height: 26px; position: relative;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .concap-logo-mark::before {
      content: ''; position: absolute; inset: 0;
      border: 1.5px solid #FF5B2E; border-radius: 50%;
    }
    .concap-logo-mark::after {
      content: ''; width: 8px; height: 8px;
      background: #FF5B2E; border-radius: 50%;
      animation: concapPulse 2.2s ease-in-out infinite;
    }
    @keyframes concapPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }
  </style>
  <script src="/static/auth.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand" style="margin-bottom:24px;">
        <div class="concap-logo">
          <div class="concap-logo-mark"></div>
          Concap AI
        </div>
      </div>

      <h1>Sign in</h1>
      <p class="sub">Use your account to access capture, sessions, and the dashboard.</p>

      <div id="alert" role="alert" aria-live="assertive"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" id="submit-btn">Sign in</button>
      </form>

      <div id="preview-entry" hidden style="margin-top:16px;">
        <p class="sub" style="margin:0 0 10px;">Preview mode uses a separate Preview Workspace. Changes there won’t affect another account.</p>
        <button type="button" id="preview-btn">Continue to preview</button>
      </div>

      <!-- <div class="switch">
        No account? <a href="/signup">Create one</a>
      </div> -->
    </div>
  </div>

  <script>
    (function () {
      // Already signed in? Skip the form.
      if (window.Auth && window.Auth.isAuthed()) {
        window.location.replace("/dashboard");
        return;
      }
      var form = document.getElementById("login-form");
      var alertEl = document.getElementById("alert");
      var btn = document.getElementById("submit-btn");
      var previewEntry = document.getElementById("preview-entry");
      var previewBtn = document.getElementById("preview-btn");

      function showError(msg) {
        alertEl.textContent = msg;
        alertEl.className = "alert error";
      }

      fetch("/api/auth/preview-enabled")
        .then(function (resp) { return resp.ok ? resp.json() : { enabled: false }; })
        .then(function (data) {
          if (data.enabled) previewEntry.hidden = false;
        })
        .catch(function () {});

      previewBtn.addEventListener("click", async function () {
        previewBtn.disabled = true;
        alertEl.textContent = "";
        alertEl.className = "";
        try {
          var resp = await fetch("/api/auth/preview", { method: "POST" });
          var data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || ("Preview login failed (" + resp.status + ")"));
          window.Auth.set(data.token, data.user);
          window.location.href = "/dashboard";
        } catch (err) {
          showError(err.message);
          previewBtn.disabled = false;
        }
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        btn.disabled = true;
        alertEl.innerHTML = "";
          alertEl.className = "";
        try {
          var resp = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value,
            }),
          });
          var data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || ("Login failed (" + resp.status + ")"));
          window.Auth.set(data.token, data.user);
          window.location.href = "/dashboard";
        } catch (err) {
          showError(err.message);
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
