<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Concap AI</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
  <style>
    .concap-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Fraunces', 'Times New Roman', serif;
      font-size: 22px; font-weight: 400;
      letter-spacing: -0.02em; font-style: italic;
      color: #fff;
    }
    .concap-logo-mark {
      width: 26px; height: 26px; position: relative;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .concap-logo-mark::before {
      content: ''; position: absolute; inset: 0;
      border: 1.5px solid #FF5B2E; border-radius: 50%;
    }
    .concap-logo-mark::after {
      content: ''; width: 8px; height: 8px;
      background: #FF5B2E; border-radius: 50%;
      animation: concapPulse 2.2s ease-in-out infinite;
    }
    @keyframes concapPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }
  </style>
  <script src="/static/auth.js"></script>
  <script src="/static/appnav.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand" style="margin-bottom:24px;">
        <div class="concap-logo">
          <div class="concap-logo-mark"></div>
          Concap AI
        </div>
      </div>

      <!-- <div class="nav-section">Capture</div>
      <a class="nav-item" href="/booth"><span class="icon">●</span> Per-visitor capture</a>
      <a class="nav-item" href="/long-capture"><span class="icon">▤</span> Long-capture session</a>
      <a class="nav-item" href="/transcribe"><span class="icon">✎</span> Quick transcribe</a> -->

      <div class="nav-section">Insights</div>
      <a class="nav-item" href="/dashboard"><span class="icon">◧</span> Dashboard</a>

      <!-- <div class="nav-section">Organization</div> -->
      <!-- <a class="nav-item active" href="/admin"><span class="icon">▦</span> Admin</a>
      <a class="nav-item" href="/members"><span class="icon">◰</span> Members</a> -->

      <div class="footer">
        <div class="row" style="margin-bottom: 10px;">
          <span class="dot"></span>
          <span id="org-name">—</span>
        </div>
        <div class="account">
          <span class="avatar">@</span>
          <span class="email" id="auth-email">—</span>
        </div>
        <a class="logout" id="auth-logout">Sign out</a>
      </div>
    </aside>

    <main class="content">
      <div class="content-inner">
        <div class="page-header">
          <div>
            <h1 id="org-title">Company admin</h1>
            <div class="subtitle" id="org-subtitle">Overview of your organization's data.</div>
          </div>
          <div class="actions">
            <a href="/members" class="btn secondary">Manage members</a>
            <button class="secondary" id="btn-refresh">Refresh</button>
          </div>
        </div>

        <div id="alert"></div>

        <div class="stat-grid" id="stat-grid">
          <div class="stat"><div class="label">Members</div><div class="value" id="s-members">—</div></div>
          <div class="stat"><div class="label">Visitors</div><div class="value" id="s-visitors">—</div></div>
          <div class="stat"><div class="label">Conversations</div><div class="value" id="s-conversations">—</div></div>
          <div class="stat"><div class="label">Sessions</div><div class="value" id="s-sessions">—</div></div>
          <div class="stat"><div class="label">Hot leads</div><div class="value" id="s-hot">—</div></div>
          <div class="stat"><div class="label">Warm leads</div><div class="value" id="s-warm">—</div></div>
        </div>

        <div class="split-2">
          <section class="card flush">
            <div class="card-header"><h2>Members</h2><a href="/members" class="btn ghost">Manage &rarr;</a></div>
            <div class="table-scroll">
            <table class="compact">
              <thead><tr><th>Email</th><th>Role</th><th>Status</th></tr></thead>
              <tbody id="members-body"><tr><td colspan="3" class="muted" style="padding:16px;">Loading…</td></tr></tbody>
            </table>
            </div>
          </section>

          <section class="card flush">
            <div class="card-header"><h2>Recent captures</h2><a href="/dashboard" class="btn ghost">Dashboard &rarr;</a></div>
            <div class="table-scroll">
            <table class="compact">
              <thead><tr><th>Visitor</th><th>Score</th><th>Status</th><th>When</th></tr></thead>
              <tbody id="recent-body"><tr><td colspan="4" class="muted" style="padding:16px;">Loading…</td></tr></tbody>
            </table>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/admin.js"></script>
</body>
</html>
