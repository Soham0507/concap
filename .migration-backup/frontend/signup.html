<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Create account — Concap AI</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/auth.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
  <style>
    .concap-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Fraunces', 'Times New Roman', serif;
      font-size: 22px; font-weight: 400;
      letter-spacing: -0.02em; font-style: italic;
      color: #fff;
    }
    .concap-logo-mark {
      width: 26px; height: 26px; position: relative;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .concap-logo-mark::before {
      content: ''; position: absolute; inset: 0;
      border: 1.5px solid #FF5B2E; border-radius: 50%;
    }
    .concap-logo-mark::after {
      content: ''; width: 8px; height: 8px;
      background: #FF5B2E; border-radius: 50%;
      animation: concapPulse 2.2s ease-in-out infinite;
    }
    @keyframes concapPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand" style="margin-bottom:24px;">
        <div class="concap-logo">
          <div class="concap-logo-mark"></div>
          Concap AI
        </div>
      </div>

      <h1>Create account</h1>
      <p class="sub">You'll own the workspace you create here.</p>

      <div id="alert"></div>

      <form id="signup-form">
        <div class="field">
          <label>Account type</label>
          <div style="display:flex; gap:8px;">
            <label style="flex:1; display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; font-weight:500;">
              <input type="radio" name="acct" value="individual" checked style="width:auto;" /> Individual
            </label>
            <label style="flex:1; display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; font-weight:500;">
              <input type="radio" name="acct" value="company" style="width:auto;" /> Company
            </label>
          </div>
        </div>
        <div class="field hidden" id="company-field">
          <label for="company">Company name</label>
          <input id="company" type="text" placeholder="e.g. Acme Corp" />
        </div>
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" type="text" autocomplete="name" placeholder="Optional" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password" required minlength="8" />
          <div class="subtle" style="margin-top:6px;">At least 8 characters.</div>
        </div>
        <button type="submit" id="submit-btn">Create account</button>
      </form>

      <div class="switch">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      if (window.Auth && window.Auth.isAuthed()) {
        window.location.replace("/booth");
        return;
      }
      var form = document.getElementById("signup-form");
      var alertEl = document.getElementById("alert");
      var btn = document.getElementById("submit-btn");
      var companyField = document.getElementById("company-field");

      form.acct.forEach(function (r) {
        r.addEventListener("change", function () {
          companyField.classList.toggle("hidden", form.acct.value !== "company");
        });
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        btn.disabled = true;
        alertEl.innerHTML = "";
        var pw = document.getElementById("password").value;
        if (pw.length < 8) {
          alertEl.innerHTML = '<div class="alert error">Password must be at least 8 characters.</div>';
          btn.disabled = false;
          return;
        }
        var acctType = form.acct.value;
        var companyName = document.getElementById("company").value.trim();
        if (acctType === "company" && !companyName) {
          alertEl.innerHTML = '<div class="alert error">Company name is required for a company account.</div>';
          btn.disabled = false;
          return;
        }
        try {
          var resp = await fetch("/api/auth/signup", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              name: document.getElementById("name").value.trim() || null,
              email: document.getElementById("email").value.trim(),
              password: pw,
              account_type: acctType,
              company_name: acctType === "company" ? companyName : null,
            }),
          });
          var data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || ("Signup failed (" + resp.status + ")"));
          window.Auth.set(data.token, data.user);
          window.location.href = "/booth";
        } catch (err) {
          alertEl.innerHTML = '<div class="alert error">' + err.message + "</div>";
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
