<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Sign in — Concap AI</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
  <style>
    .concap-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Fraunces', 'Times New Roman', serif;
      font-size: 22px; font-weight: 400;
      letter-spacing: -0.02em; font-style: italic;
      color: #fff;
    }
    .concap-logo-mark {
      width: 26px; height: 26px; position: relative;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .concap-logo-mark::before {
      content: ''; position: absolute; inset: 0;
      border: 1.5px solid #FF5B2E; border-radius: 50%;
    }
    .concap-logo-mark::after {
      content: ''; width: 8px; height: 8px;
      background: #FF5B2E; border-radius: 50%;
      animation: concapPulse 2.2s ease-in-out infinite;
    }
    @keyframes concapPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }
    .auth-divider { display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--text-subtle); font-size:12px; }
    .auth-divider::before, .auth-divider::after { content:""; flex:1; height:1px; background:var(--border); }
    .btn-google { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:10px 14px; border-radius:var(--radius); border:1px solid var(--border); background:#fff; color:#1f1f1f; font-weight:500; font-size:14px; text-decoration:none; transition: all .14s ease; box-sizing:border-box; }
    .btn-google:hover { background:#f3f3f3; border-color:var(--border-strong); }
    .btn-google svg { width:18px; height:18px; flex-shrink:0; }
    .btn-google[hidden], .auth-divider[hidden] { display:none; }
  </style>
  <script src="/static/auth.js"></script>
  <script src="/static/google-auth.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand" style="margin-bottom:24px;">
        <div class="concap-logo">
          <div class="concap-logo-mark"></div>
          Concap AI
        </div>
      </div>

      <h1>Sign in</h1>
      <p class="sub">Use your account to access capture, sessions, and the dashboard.</p>

      <div id="alert" role="alert" aria-live="assertive"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" id="submit-btn">Sign in</button>
      </form>

      <div class="auth-divider" id="google-divider" hidden>or</div>
      <a href="/api/auth/google/start" class="btn-google" id="google-btn" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3.1 0 5.9 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"/>
          <path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 35.2 26.8 36 24 36c-5.4 0-9.9-3.4-11.5-8.1l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.5 5.6-6.6 7.1l6.3 5.3C38.5 37.6 44 31.6 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Continue with Google
      </a>

      <div id="preview-entry" hidden style="margin-top:16px;">
        <p class="sub" style="margin:0 0 10px;">Preview mode uses a separate Preview Workspace. Changes there won’t affect another account.</p>
        <button type="button" id="preview-btn">Continue to preview</button>
      </div>

      <div class="switch">
        No account? <a href="/signup">Create account</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var alertEl;
      function showError(msg) {
        if (!alertEl) alertEl = document.getElementById("alert");
        alertEl.textContent = msg;
        alertEl.className = "alert error";
      }

      // A redirect back from /api/auth/google/callback carries the result in
      // the URL fragment — handle that before anything else on the page.
      var googleToken = window.GoogleAuth.consumeToken();
      if (googleToken) {
        window.GoogleAuth.finishLogin(googleToken).then(function (ok) {
          if (ok) window.location.href = "/dashboard";
          else { boot(); showError("Google sign-in failed. Please try again."); }
        });
        return;
      }
      boot();

      function boot() {
      // Already signed in? Skip the form.
      if (window.Auth && window.Auth.isAuthed()) {
        window.location.replace("/dashboard");
        return;
      }
      var form = document.getElementById("login-form");
      alertEl = document.getElementById("alert");
      var btn = document.getElementById("submit-btn");
      var previewEntry = document.getElementById("preview-entry");
      var previewBtn = document.getElementById("preview-btn");
      var googleBtn = document.getElementById("google-btn");
      var googleDivider = document.getElementById("google-divider");

      var googleError = window.GoogleAuth.consumeError();
      if (googleError) showError(googleError);

      fetch("/api/auth/google/enabled")
        .then(function (resp) { return resp.ok ? resp.json() : { enabled: false }; })
        .then(function (data) { if (data.enabled) { googleBtn.hidden = false; googleDivider.hidden = false; } })
        .catch(function () {});

      fetch("/api/auth/preview-enabled")
        .then(function (resp) { return resp.ok ? resp.json() : { enabled: false }; })
        .then(function (data) {
          if (data.enabled) previewEntry.hidden = false;
        })
        .catch(function () {});

      previewBtn.addEventListener("click", async function () {
        previewBtn.disabled = true;
        alertEl.textContent = "";
        alertEl.className = "";
        try {
          var resp = await fetch("/api/auth/preview", { method: "POST" });
          var data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || ("Preview login failed (" + resp.status + ")"));
          window.Auth.set(data.token, data.user);
          window.location.href = "/dashboard";
        } catch (err) {
          showError(err.message);
          previewBtn.disabled = false;
        }
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        btn.disabled = true;
        alertEl.innerHTML = "";
          alertEl.className = "";
        try {
          var resp = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value,
            }),
          });
          var data = await resp.json();
          if (!resp.ok) throw new Error(data.detail || ("Login failed (" + resp.status + ")"));
          window.Auth.set(data.token, data.user);
          window.location.href = "/dashboard";
        } catch (err) {
          showError(err.message);
          btn.disabled = false;
        }
      });
      } // end boot()
    })();
  </script>
</body>
</html>
