kind = "mobile"
previewPath = "/concap-plaud-mobile/"
title = "Concap Plaud Companion"
description = "Connect a Plaud recorder to Concap, transfer recordings, and view transcripts and meeting results on the same account as the website."
version = "1.0.0"
id = "artifacts/concap-plaud-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/concap-plaud-mobile/" ]
localPort = 22156

[services.development]
run = "pnpm --filter @workspace/concap-plaud-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/concap-plaud-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/concap-plaud-mobile", "run", "serve" ]

[services.env]
PORT = "22156"
BASE_PATH = "/concap-plaud-mobile/"
